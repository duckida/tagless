<!DOCTYPE html>
<html>
    <head>
        <style>
            /* We remove margins and hide overflow to make the canvas fill the entire screen */
            html, body { margin: 0; height: 100%; overflow: hidden; }
            /* We set the canvas to block display and take up 100% of the viewport width and height */
            canvas { display: block; width: 100vw; height: 100vh; }
        </style>
    </head>

    <body>
        <canvas id="canvas"></canvas>

        <script>
          const canvas = document.getElementById("canvas");
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;

          const ctx = canvas.getContext("2d");
          ctx.font = "50px Arial";

          var letter_counts = 0;
          var x_coord = 50;
          var y_coord = 50;

          window.addEventListener("keydown", function (event) {
            if (event.key.length == 1) { // it's a letter key
              if (letter_counts < 5) { // not all full yet
                ctx.fillText(event.key, x_coord, y_coord);
                x_coord += 50
                letter_counts += 1;
              }
            }

            else if (event.key === "Enter" && letter_counts === 5) { // submit the word
              letter_counts = 0;
              x_coord = 50;
              y_coord += 50;
            }
          })


        </script>
    </body>
</html>
