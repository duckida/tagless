<!DOCTYPE html>
<html>
    <head>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=LINE+Seed+JP&display=swap');
            /* We remove margins and hide overflow to make the canvas fill the entire screen */
            html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'LINE Seed JP'; }
            /* We set the canvas to block display and take up 100% of the viewport width and height */
            canvas { display: block; width: 100vw; height: 100vh; }
        </style>
    </head>

    <body>
        <canvas id="canvas"></canvas>

        <script>
          const canvas = document.getElementById("canvas");
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;

          const ctx = canvas.getContext("2d");
          ctx.font = "50px Line Seed JP";

          var letter_counts = 0;
          var x_coord = 50;
          var y_coord = 50;

          let words = ["ocean", "apple", "words", "plant", "nexus", "plane", "adept", "uncut", "claim", "bathe"];

          var guess = "";
          let target = words[Math.floor(Math.random() * words.length)];

          window.addEventListener("keydown", function (event) {
            if (event.key.length == 1) { // it's a letter key
              if (letter_counts < 5) { // not all full yet
                guess += event.key;
                ctx.fillText(event.key.toUpperCase(), x_coord, y_coord);
                x_coord += 50
                letter_counts += 1;
              }
            }

            else if (event.key === "Enter" && letter_counts === 5) { // submit the word
              let check_x_coord = 50;
              // evaluate the guess here
              //
              for (var index = 0; index < 5; index++) {
                let letter_val = guess[index]; // the guess value of that letter

                ctx.beginPath();
                ctx.rect(check_x_coord - 5, y_coord + 10, 50, -60)

                if (letter_val == target[index]) {
                  ctx.fillStyle = "#0f9d58";
                }
                else if (target.includes(letter_val)) {
                  ctx.fillStyle = "#fbbc05";
                }
                else {
                  ctx.fillStyle = "#bdbdbd";
                }

                ctx.fill();

                ctx.fillStyle = "white";
                ctx.fillText(letter_val.toUpperCase(), check_x_coord, y_coord);

                check_x_coord += 50;
                ctx.fillStyle = "black";
              }

              guess = "";

              letter_counts = 0;
              x_coord = 50;
              y_coord += 60;
            }

            else if (event.key === "Backspace" && letter_counts > 0){
              ctx.rect(x_coord - 5, y_coord + 10, -50, -50)
              ctx.fillStyle = "white";
              ctx.fill();

              ctx.fillStyle = "black"; // reset

              guess = guess.slice(0, -1);
              letter_counts -= 1;
              x_coord -= 50;

            }
          })


        </script>
    </body>
</html>
